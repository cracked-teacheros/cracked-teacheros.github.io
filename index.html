<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startseite | TeacherOS Cracked</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    :root {
        color-scheme: dark;

        --primary-color: #a52236;
        --primary-text-color: #d94a5e;
        --sidebar-fg: #ffffff;
        --btn-text-color: #ffffff;

        --card-bg: #191619;
        --text-dark: #f2edf0;
        --text-light: #a69ba2;
        --accent-green: #39b878;
        --accent-red: #d04452;
        --border-color: #373037;
        --main-bg: #100e11;

        --accent: #c42f45;
        --green: var(--accent-green);
        --blue: var(--primary-color);
        --blue2: var(--primary-text-color);
        --bg: var(--main-bg);
        --card: var(--card-bg);
        --border: var(--border-color);
        --text: var(--text-dark);
        --muted: var(--text-light);

        --tos-nav-bg: #191115;
        --tos-accent: var(--primary-color);
        --tos-surface: #21191e;
        --tos-hover: #302027;
        --tos-border: var(--border-color);

        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 17px;

        --transition: .18s ease;
    }

    body.dark-mode {
        --card-bg: #151316;
        --text-dark: #f5f0f2;
        --text-light: #a69ba2;
        --border-color: #30282e;
        --main-bg: #0b0a0c;

        --bg: var(--main-bg);
        --card: var(--card-bg);
        --border: var(--border-color);
        --text: var(--text-dark);
        --muted: var(--text-light);

        --tos-nav-bg: #120d10;
        --tos-surface: #191417;
        --tos-hover: #29191f;
        --tos-border: var(--border-color);
    }

    html {
        min-height: 100%;
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
    }

    body {
        min-height: 100vh;
        font-family: 'Roboto', sans-serif;
        color: var(--text);
        background: var(--bg);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
    }

    button, input, textarea, select { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible {
        outline: 2px solid #e34b60;
        outline-offset: 3px;
    }

    /* ── Landing / Login ─────────────────────────────────────── */

    #landing {
        position: relative;
        isolation: isolate;
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 38px 18px;
        overflow: hidden;
        background:
            radial-gradient(ellipse at 50% 10%, rgba(165,34,54,.19), transparent 58%),
            linear-gradient(145deg, #09090b, #151014 55%, #0a090b);
    }

    #landing::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background-image:
            linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
        background-size: 34px 34px;
        mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    #landing::after {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, #76202e, #e34b60, #76202e, transparent);
    }

    .landing-logo {
        width: 68px;
        height: 68px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        border: 1px solid #592631;
        border-radius: 18px;
        background: linear-gradient(145deg, #2b171e, #171114);
        color: #ed5266;
        font-size: 1.9rem;
        box-shadow: 0 0 35px rgba(190,35,55,.13);
    }

    .landing-title {
        margin-bottom: 8px;
        color: #faf5f7;
        font-size: clamp(1.7rem, 5vw, 2.15rem);
        font-weight: 900;
        letter-spacing: -.045em;
        line-height: 1.2;
        text-align: center;
    }

    .landing-sub {
        max-width: 310px;
        margin-bottom: 30px;
        color: #a99ba2;
        font-size: .9rem;
        line-height: 1.65;
        text-align: center;
    }

    .login-card {
        width: 100%;
        max-width: 400px;
        padding: 30px;
        border: 1px solid #382b32;
        border-radius: var(--radius-lg);
        background: #191619;
        box-shadow: 0 25px 75px rgba(0,0,0,.5), 0 0 35px rgba(165,34,54,.055);
        animation: login-enter .28s ease both;
    }

    @keyframes login-enter {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .role-prompt {
        margin-bottom: 18px;
        color: #a99ba2;
        font-size: .73rem;
        font-weight: 800;
        letter-spacing: .12em;
        text-align: center;
        text-transform: uppercase;
    }

    .role-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }

    .role-btn {
        display: flex;
        align-items: center;
        gap: 13px;
        width: 100%;
        min-height: 60px;
        padding: 13px 15px;
        border: 1px solid #403139;
        border-radius: 11px;
        background: linear-gradient(110deg, #251a20, #1c171b);
        color: #f5edf0;
        font-family: 'Roboto', sans-serif;
        font-size: .92rem;
        font-weight: 700;
        text-align: left;
        cursor: pointer;
        transition: background var(--transition), border-color var(--transition), box-shadow var(--transition), transform var(--transition);
    }

    .role-btn i {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        width: 37px;
        height: 37px;
        border: 1px solid #542631;
        border-radius: 9px;
        background: #301820;
        color: #e64b61;
        font-size: 1.05rem;
        transition: transform var(--transition);
    }

    .role-btn:hover { border-color: #923344; background: #2b1c23; box-shadow: 0 0 20px rgba(190,35,55,.09); }
    .role-btn:hover i { transform: translateX(2px); }
    .role-btn:active { transform: scale(.99); }

    .form-panel { display: none; }

    .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 22px;
        padding: 4px 0;
        border: none;
        background: transparent;
        color: #a99ba2;
        font-family: 'Roboto', sans-serif;
        font-size: .82rem;
        cursor: pointer;
        transition: color var(--transition);
    }
    .back-btn:hover { color: #ed5266; }

    .form-title {
        margin-bottom: 6px;
        color: #f8f1f4;
        font-size: 1.3rem;
        font-weight: 900;
        letter-spacing: -.025em;
        line-height: 1.35;
    }

    .form-sub { margin-bottom: 24px; color: #a99ba2; font-size: .85rem; line-height: 1.6; }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 17px;
        color: #c4b6bd;
        font-size: .72rem;
        font-weight: 800;
        letter-spacing: .07em;
        text-transform: uppercase;
    }

    .form-group input,
    .login-card input,
    #landing input {
        display: block;
        width: 100%;
        min-width: 0;
        min-height: 47px;
        padding: 12px 14px;
        border: 1px solid #40343b;
        border-radius: 9px;
        outline: none;
        background: #100e11 !important;
        color: #f5edf0 !important;
        caret-color: #ed5266;
        font-family: 'Roboto', sans-serif;
        font-size: 16px;
        font-weight: 400;
        letter-spacing: normal;
        text-transform: none;
        box-shadow: none;
        transition: border-color var(--transition), box-shadow var(--transition);
    }

    .form-group input::placeholder,
    .login-card input::placeholder,
    #landing input::placeholder { color: #776a72; opacity: 1; }

    .form-group input:-webkit-autofill,
    .form-group input:-webkit-autofill:hover,
    .form-group input:-webkit-autofill:focus,
    .login-card input:-webkit-autofill,
    .login-card input:-webkit-autofill:hover,
    .login-card input:-webkit-autofill:focus,
    #landing input:-webkit-autofill,
    #landing input:-webkit-autofill:hover,
    #landing input:-webkit-autofill:focus {
        -webkit-text-fill-color: #f5edf0 !important;
        caret-color: #ed5266;
        -webkit-box-shadow: 0 0 0 1000px #100e11 inset !important;
        box-shadow: 0 0 0 1000px #100e11 inset !important;
        border: 1px solid #40343b;
        transition: background-color 99999s ease-out;
    }

    .form-group input:hover, .login-card input:hover { border-color: #60404a; }
    .form-group input:focus, .login-card input:focus, #landing input:focus {
        border-color: #c53b52;
        background: #151014 !important;
        box-shadow: 0 0 0 3px rgba(197,59,82,.14);
    }

    .btn-primary {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        width: 100%;
        min-height: 48px;
        margin-top: 8px;
        padding: 13px 18px;
        border: 1px solid #c33b51;
        border-radius: 9px;
        background: linear-gradient(135deg, #b52e45, #841c31);
        color: #fff;
        font-family: 'Roboto', sans-serif;
        font-size: .92rem;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 5px 18px rgba(165,34,54,.15);
        transition: background var(--transition), border-color var(--transition), box-shadow var(--transition), transform var(--transition);
    }

    .btn-primary:hover:not(:disabled) {
        border-color: #ed5266;
        background: linear-gradient(135deg, #cc3852, #9c233b);
        box-shadow: 0 6px 24px rgba(190,35,55,.24);
    }
    .btn-primary:active:not(:disabled) { transform: scale(.99); }
    .btn-primary:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }

    .login-error {
        display: none;
        margin-top: 13px;
        padding: 11px 13px;
        border: 1px solid #71303c;
        border-radius: 9px;
        background: #281419;
        color: #ff8999;
        font-size: .82rem;
        line-height: 1.5;
        overflow-wrap: anywhere;
    }

    /* ── Home ────────────────────────────────────────────────── */

    #home {
        display: none;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100svh;
        background:
            radial-gradient(ellipse at 50% 0%, rgba(165,34,54,.07), transparent 50%),
            linear-gradient(180deg, #0e0c0f 0%, #100e11 100%);
    }

    /* Hero header — same language as the login page */
    .home-header {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        padding: 52px 24px 44px;
        text-align: center;
        background:
            radial-gradient(ellipse at 50% 0%, rgba(165,34,54,.22), transparent 60%),
            linear-gradient(160deg, #0d0a0e, #16101a 55%, #0a090b);
    }

    /* Dot grid — same as login */
    .home-header::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background-image:
            linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
        background-size: 34px 34px;
        mask-image: linear-gradient(to bottom, black, transparent 90%);
    }

    /* Red line at bottom */
    .home-header::after {
        content: "";
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, #c2394a 30%, #e34b60 50%, #c2394a 70%, transparent);
    }

    .home-header-inner {
        position: relative;
        z-index: 1;
        max-width: 600px;
        margin: 0 auto;
    }

    .home-header-icon {
        width: 52px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 18px;
        border: 1px solid #592631;
        border-radius: 14px;
        background: linear-gradient(145deg, #2b171e, #171114);
        color: #ed5266;
        font-size: 1.4rem;
        box-shadow: 0 0 28px rgba(190,35,55,.15);
    }

    .home-header h1 {
        margin-bottom: 8px;
        color: #faf5f7;
        font-size: clamp(1.45rem, 4vw, 2rem);
        font-weight: 900;
        letter-spacing: -.04em;
        line-height: 1.2;
        overflow-wrap: anywhere;
    }

    .home-header p {
        color: #9a8890;
        font-size: .88rem;
        line-height: 1.6;
        font-weight: 400;
    }

    /* Main content area */
    .home-main {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 16px;
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        padding: 28px 20px 40px;
    }

    /* Section label — small uppercase track above a group */
    .home-section-label {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 10px;
        color: #5a4a52;
        font-size: .7rem;
        font-weight: 800;
        letter-spacing: .1em;
        text-transform: uppercase;
    }

    .home-section-label i { color: #7a3040; font-size: .75rem; }

    /* Base card — now matches achievements / heute style */
    .home-card {
        min-width: 0;
        padding: 22px 24px;
        border: 1px solid #3a2830;
        border-radius: var(--radius-md);
        background: #111013;
        box-shadow: 0 6px 24px rgba(0,0,0,.3);
    }

    .home-card-title {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
        padding-bottom: 14px;
        border-bottom: 1px solid #221820;
        color: #e8d0d8;
        font-size: .95rem;
        font-weight: 800;
        letter-spacing: -.02em;
        line-height: 1.3;
    }

    .home-card-title i { color: #d04452; font-size: 1rem; }

    /* Feedback / announcement card — accent left border */
    .fb-home {
        padding: 20px 22px;
        border: 1px solid #66303a;
        border-left: 3px solid #bd3447;
        border-radius: var(--radius-md);
        background: linear-gradient(125deg, rgba(165,34,54,.1), rgba(165,34,54,.018));
        box-shadow: 0 4px 20px rgba(0,0,0,.2);
    }

    .fb-home-title {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 10px;
        color: #ed6473;
        font-size: .95rem;
        font-weight: 800;
        letter-spacing: -.01em;
    }

    .fb-home-title .fb-badge {
        padding: 2px 8px;
        border: 1px solid rgba(255,255,255,.08);
        border-radius: 6px;
        background: #a52236;
        color: #fff;
        font-size: .66rem;
        font-weight: 800;
        letter-spacing: .05em;
        text-transform: uppercase;
    }

    .fb-home p {
        margin: 0 0 14px;
        color: #a89298;
        font-size: .87rem;
        line-height: 1.7;
        overflow-wrap: anywhere;
    }

    .fb-home-links { display: flex; flex-wrap: wrap; gap: 8px; }

    .fb-home-links a {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 36px;
        padding: 7px 13px;
        border: 1px solid #5a2830;
        border-radius: var(--radius-sm);
        background: #1e1218;
        color: #e8d0d8;
        text-decoration: none;
        font-size: .82rem;
        font-weight: 700;
        overflow-wrap: anywhere;
        transition: background var(--transition), border-color var(--transition);
    }

    .fb-home-links a:hover { border-color: #c2394a; background: #2a1820; }

    /* Subject grid — flat list style, no tall tiles */
    .subject-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
    }

    .subject-btn {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 11px;
        min-width: 0;
        min-height: 120px;
        padding: 18px 12px;
        border: 1px solid #2d2028;
        border-radius: var(--radius-md);
        background: #16121a;
        color: #e8d0d8;
        text-decoration: none;
        text-align: center;
        font-size: .84rem;
        font-weight: 700;
        cursor: pointer;
        overflow-wrap: anywhere;
        transition: transform var(--transition), border-color var(--transition), background var(--transition), box-shadow var(--transition);
    }

.home-card {
    position: relative;
    overflow: hidden;
}

.home-card::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 5px;
    background: #b52e45;
    border-radius: var(--radius-md) 0 0 var(--radius-md);
}

    .subject-btn:hover::before { opacity: 1; }

    .subject-btn i {
        color: var(--mod-color, #d04452);
        font-size: 1.6rem;
        transition: transform var(--transition);
    }

    .subject-btn img.tile-logo {
        display: block;
        width: 2.2rem;
        height: 2.2rem;
        object-fit: contain;
    }

    .subject-btn .subject-name {
        color: #7a6a72;
        font-size: .76rem;
        line-height: 1.45;
        font-weight: 500;
        text-align: center;
    }

    .subject-btn .subject-code {
        color: var(--mod-color, #e15a69);
        font-size: .9rem;
        font-weight: 800;
    }

    .subject-btn:hover {
        transform: translateY(-2px);
        border-color: var(--mod-color, #7a3040);
        background: #1c1520;
        box-shadow: 0 6px 20px rgba(0,0,0,.25);
    }

    .subject-btn:hover i { transform: scale(1.07); }
    .subject-btn:active { transform: translateY(0); }

    /* Empty state */
    .no-modules {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 40px 20px;
        border: 1px dashed #2d2028;
        border-radius: var(--radius-md);
        color: #5a4a52;
        text-align: center;
        overflow-wrap: anywhere;
    }

    .no-modules i { color: #5a2a32; font-size: 1.8rem; }
    .no-modules strong { color: #8a7080; font-size: .9rem; }
    .no-modules span { font-size: .82rem; line-height: 1.6; }

    /* Footer */
    footer {
        padding: 22px 18px;
        border-top: 1px solid #1e1820;
        color: #3a2a32;
        font-size: .76rem;
        line-height: 1.7;
        text-align: center;
    }

    footer a { color: #5a3a42; text-decoration: none; transition: color var(--transition); }
    footer a:hover { color: #c2394a; }

    /* ── Responsive ──────────────────────────────────────────── */

    @media (max-width: 768px) {
        .home-header { padding: 40px 18px 34px; }
        .home-main { gap: 13px; padding: 20px 15px 32px; }
        .home-card { padding: 18px 17px; }
        .subject-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
    }

    @media (max-width: 480px) {
        #landing { padding: 24px 15px; }

        .landing-logo { width: 58px; height: 58px; margin-bottom: 16px; border-radius: 15px; font-size: 1.65rem; }
        .landing-title { font-size: 1.65rem; }
        .landing-sub { margin-bottom: 23px; font-size: .85rem; }
        .login-card { padding: 22px 18px; border-radius: 14px; }
        .role-prompt { margin-bottom: 14px; font-size: .7rem; }
        .role-btn { min-height: 56px; padding: 11px 12px; font-size: .88rem; }
        .role-btn i { width: 34px; height: 34px; }
        .form-title { font-size: 1.18rem; }
        .form-sub { margin-bottom: 20px; }

        .home-header { padding: 32px 15px 28px; }
        .home-header-icon { width: 44px; height: 44px; font-size: 1.15rem; margin-bottom: 14px; }
        .home-header h1 { font-size: 1.35rem; }
        .home-header p { font-size: .83rem; }
        .home-main { gap: 11px; padding: 16px 12px 28px; }
        .home-card { padding: 15px 14px; }
        .home-card-title { margin-bottom: 14px; padding-bottom: 11px; font-size: .9rem; }

        .subject-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
        .subject-btn { min-height: 106px; padding: 14px 8px; gap: 9px; font-size: .8rem; }
        .subject-btn i { font-size: 1.45rem; }
        .subject-btn img.tile-logo { width: 1.9rem; height: 1.9rem; }
        .subject-btn .subject-name { font-size: .72rem; }

        .fb-home { padding: 15px 15px; }
        .fb-home-title { font-size: .9rem; }
        .fb-home-links a { flex: 1 1 auto; font-size: .8rem; }

        @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-6px); }
        40%, 80% { transform: translateX(6px); }
    }

    .shake-anim {
        animation: shake 0.4s ease-in-out both;
    }

        footer { padding: 18px 12px; }
    }

    @media (max-width: 340px) {
        .login-card { padding: 19px 14px; }
        .landing-title { font-size: 1.45rem; }
        .subject-grid { grid-template-columns: 1fr; }
        .subject-btn { min-height: 90px; flex-direction: row; justify-content: flex-start; padding: 14px 16px; gap: 14px; text-align: left; }
        .subject-btn::before { top: 0; left: 0; right: auto; bottom: 0; width: 2px; height: auto; border-radius: var(--radius-md) 0 0 var(--radius-md); }
        .home-card { padding: 14px 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            scroll-behavior: auto !important;
